jupyterhub:
  httpRoute:
    hostnames:
      - hub.biojupyter.minrk.net
  hub:
    db:
      pvc:
        # need at least 4G for hyperdisk
        storage: 4Gi
    config:
      JupyterHub:
        authenticator_class: github
        public_url: https://hub.biojupyter.minrk.net
      OAuthenticator:
        oauth_callback_url: https://hub.biojupyter.minrk.net/hub/oauth_callback
      GitHubOAuthenticator:
        scope:
          - "user:email"
          - "read:org"
  singleuser:
    memory:
      limit: 4G
      guarantee: 2G
    cpu:
      limit: 1
      guarantee: 0.5
    image:
      name: ghcr.io/bids/biojupyter-user
      tag: main
      pullPolicy: Always
    extraEnv:
      BIOROUTER_PROVIDER: nrp
      BIOROUTER_MODEL: qwen3
    extraFiles:
      biorouterNRP:
        mountPath: /home/jovyan/.config/biorouter/custom_providers/nrp.json
        data:
          name: nrp
          engine: openai
          display_name: NRP
          description: NRP Nautilus
          api_key_env: NRP_TOKEN
          base_url: https://ellm.nrp-nautilus.io/v1
          models:
            - name: qwen3
              context_limit: 1000000
            - name: qwen3-small
              context_limit: 1000000
            - name: gpt-oss
              context_limit: 131072
            - name: gemma
              context_limit: 262144
            - name: gemma-small
              context_limit: 262144
            - name: kimi
              context_limit: 131072
            - name: glm-5
              context_limit: 1048576
            - name: dedepseek-v4-flash
              context_limit: 1048576
            - name: minimax-m2
              context_limit: 204800
          supports_streaming: true
      server_config:
        mountPath: "/usr/local/etc/jupyter/jupyter_server_config.py"
        stringData: |
          import os
          public_url = os.environ["JUPYTERHUB_PUBLIC_URL"]
          print(f"{public_url=}")

          biorouter_url = f"{public_url.rstrip('/')}/biorouter/"

          c.ServerProxy.servers = {
              # vscode already enabled via package
              # "vscode": {
              #     "command": ["code-server", "--auth", "none", "--disable-telemtry", "--port={port}"],
              # },
              "biorouter": {
                  "command": [
                    "biorouter",
                    "serve",
                    # no-token is safe because this is loopback
                    # within a single container
                    "--no-token",
                    "--port={port}",
                    "--public-url",
                    biorouter_url,
                  ],
                  "request_headers_override": {
                    "Host": "localhost",
                  },
              },
          }
jupyterhub-home-nfs:
  prometheusExporter:
    enabled: true
  gke:
    enabled: true
    volumeId: projects/bids-biojupyter/zones/us-west2-c/disks/hub-nfs-biojupyter-hub-hyperdisk
  quotaEnforcer:
    # disable broken quota enforcer
    enabled: false
    hardQuota: "10" # in GiB
